<!doctype html>
<!-- VolunteerLink: Page structure and content for admin user management. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý người dùng - VolunteerLink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-content" id="main">
      <div class="page-header">
        <div>
          <h1>Quản lý người dùng</h1>
          <p
            style="
              color: var(--text-secondary);
              font-size: 14px;
              margin-top: 4px;
            "
          >
            Quản lý tài khoản, phân quyền vai trò và kiểm soát trạng thái truy
            cập hệ thống
          </p>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="exportUserList()">
          📥 Xuất danh sách người dùng
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="totalUsersCount">0</div>
          <div class="stat-label">Tổng người dùng</div>
        </div>
        <div class="stat-card">
          <div
            class="stat-number"
            style="color: var(--info)"
            id="volunteerCount"
          >
            0
          </div>
          <div class="stat-label">Tình nguyện viên</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" style="color: var(--accent)" id="orgCount">
            0
          </div>
          <div class="stat-label">Tổ chức xã hội</div>
        </div>
        <div class="stat-card">
          <div
            class="stat-number"
            style="color: var(--error)"
            id="lockedUsersCount"
          >
            0
          </div>
          <div class="stat-label">Tài khoản bị khóa</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="userSearchInput"
            placeholder="Tìm kiếm theo tên, email, mã người dùng..."
            oninput="filterUsers()"
          />
        </div>
        <select id="roleFilter" class="filter-select" onchange="filterUsers()">
          <option value="">-- Tất cả vai trò --</option>
          <option value="volunteer">Tình nguyện viên (volunteer)</option>
          <option value="organization">Tổ chức xã hội (organization)</option>
          <option value="coordinator">Điều phối viên (coordinator)</option>
          <option value="admin">Quản trị viên (admin)</option>
        </select>
        <select
          id="statusFilter"
          class="filter-select"
          onchange="filterUsers()"
        >
          <option value="">-- Tất cả trạng thái --</option>
          <option value="active">Đang hoạt động (active)</option>
          <option value="locked">Đã bị khóa (locked)</option>
        </select>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã</th>
              <th>Họ và tên / Đơn vị</th>
              <th>Email</th>
              <th>Vai trò</th>
              <th>Tổng giờ cống hiến</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>

      <div id="emptyContainer" class="hidden"></div>
    </main>

    <div class="modal-overlay" id="roleModal">
      <div class="modal" style="max-width: 450px">
        <div class="modal-header">
          <span>Phân quyền vai trò người dùng</span>
          <button class="modal-close" onclick="closeModal('roleModal')">
            &times;
          </button>
        </div>
        <form id="roleForm" onsubmit="handleRoleSubmit(event)">
          <div class="modal-body">
            <input type="hidden" id="roleUserId" />
            <div class="form-group">
              <label class="form-label">Người dùng</label>
              <div
                id="roleUserName"
                style="
                  font-weight: 600;
                  font-size: 15px;
                  color: var(--primary-dark);
                  padding: 6px 0;
                "
              ></div>
              <div
                id="roleUserEmail"
                style="font-size: 13px; color: var(--text-secondary)"
              ></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="selectedRole"
                >Chọn vai trò mới *</label
              >
              <select class="form-select" id="selectedRole" required>
                <option value="volunteer">Tình nguyện viên (volunteer)</option>
                <option value="organization">
                  Tổ chức xã hội (organization)
                </option>
                <option value="coordinator">
                  Điều phối viên (coordinator)
                </option>
                <option value="admin">Quản trị viên (admin)</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('roleModal')"
            >
              Hủy
            </button>
            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/modules/ai-panel.js"></script>
    <script src="../../js/modules/shift-predictor.js"></script>
    <script src="../../js/main.js"></script>
    <script src="script.js"></script>
  </body>
</html>
