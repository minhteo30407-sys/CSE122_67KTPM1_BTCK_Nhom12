<!doctype html>
<!-- VolunteerLink: Page structure and content for 403. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 - Không có quyền truy cập - VolunteerLink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="layout-public">
    <header class="public-header">
      <a
        class="logo"
        href="#"
        onclick="
          window.location.href = getPageUrl('index');
          return false;
        "
        >Volunteer<span>Link</span></a
      >
      <nav>
        <a
          href="#"
          onclick="
            window.location.href = getPageUrl('index');
            return false;
          "
          >Trang chủ</a
        >
        <a
          href="#"
          onclick="
            window.location.href = getPageUrl('login');
            return false;
          "
          >Đăng nhập</a
        >
      </nav>
    </header>

    <main class="public-content">
      <div class="error-page">
        <div class="error-code">403</div>
        <h1>Không có quyền truy cập</h1>
        <p>
          Bạn không có quyền truy cập trang này. Vui lòng kiểm tra lại tài khoản
          hoặc đăng nhập bằng vai trò thích hợp.
        </p>
        <div class="flex-center" style="gap: 12px; flex-wrap: wrap">
          <button
            class="btn btn-primary"
            onclick="window.location.href = getPageUrl('index')"
          >
            🏠 Quay lại trang chủ
          </button>
          <button
            class="btn btn-secondary"
            onclick="window.location.href = getPageUrl('login')"
          >
            🔑 Đăng nhập lại
          </button>
        </div>
      </div>
    </main>

    <footer class="public-footer">
      © 2026 VolunteerLink - BTL Phát triển ứng dụng web
    </footer>

    <script src="../../js/services.js"></script>
    <script src="../../js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
