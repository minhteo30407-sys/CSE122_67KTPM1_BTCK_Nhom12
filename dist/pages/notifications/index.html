<!doctype html>
<!-- VolunteerLink: Page structure and content for notifications. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông báo - VolunteerLink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-content" id="main">
      <div class="page-header">
        <div>
          <h1>Thông báo</h1>
          <p
            style="
              color: var(--text-secondary);
              font-size: 14px;
              margin-top: 4px;
            "
          >
            Cập nhật các hoạt động, nhắc nhở ca và thông tin từ hệ thống
          </p>
        </div>
        <div class="flex" style="gap: 8px">
          <button class="btn btn-secondary btn-sm" onclick="markAllAsRead()">
            ✓ Đánh dấu tất cả đã đọc
          </button>
          <button
            class="btn btn-danger btn-sm"
            onclick="clearAllNotifications()"
          >
            🗑️ Xóa tất cả
          </button>
        </div>
      </div>

      <div class="toolbar">
        <div class="flex" style="gap: 8px">
          <button
            id="filterAllBtn"
            class="btn btn-sm btn-primary"
            onclick="setFilter('all')"
          >
            Tất cả
          </button>
          <button
            id="filterUnreadBtn"
            class="btn btn-sm btn-secondary"
            onclick="setFilter('unread')"
          >
            Chưa đọc (<span id="unreadCount">0</span>)
          </button>
        </div>
      </div>

      <div class="card">
        <div id="notificationsContainer"></div>
      </div>
    </main>

    <script src="../../js/services.js"></script>
    <script src="../../js/modules/ai-panel.js"></script>
    <script src="../../js/modules/shift-predictor.js"></script>
    <script src="../../js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
