<!doctype html>
<!-- VolunteerLink: Page structure and content for organization shift management. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý ca làm việc - VolunteerLink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-content" id="main">
      <div class="page-header">
        <div>
          <h1>Quản lý ca làm việc</h1>
          <p
            style="
              color: var(--text-secondary);
              font-size: 14px;
              margin-top: 4px;
            "
          >
            Phân chia, theo dõi lịch trực và tối ưu hóa nhân sự tình nguyện theo
            từng ca
          </p>
        </div>
        <button class="btn btn-primary" onclick="openCreateShiftModal()">
          ➕ Tạo ca mới
        </button>
      </div>

      <div id="aiShiftPredictorPanel" class="mb-3"></div>

      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="shiftSearchInput"
            aria-label="Tìm ca theo ngày hoặc tên ca"
            placeholder="Tìm theo ngày hoặc tên ca..."
            oninput="filterShifts()"
          />
        </div>
        <select
          id="oppFilter"
          class="filter-select"
          aria-label="Lọc ca theo hoạt động"
          onchange="filterShifts()"
        >
          <option value="">-- Tất cả hoạt động --</option>
        </select>
        <select
          id="statusFilter"
          class="filter-select"
          aria-label="Lọc ca theo trạng thái"
          onchange="filterShifts()"
        >
          <option value="">-- Tất cả trạng thái --</option>
          <option value="open">Đang mở (open)</option>
          <option value="filled">Đã đủ (filled)</option>
          <option value="completed">Hoàn thành (completed)</option>
          <option value="cancelled">Đã hủy (cancelled)</option>
        </select>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã ca</th>
              <th>Hoạt động</th>
              <th>Ngày</th>
              <th>Khung giờ</th>
              <th>Đã có / Yêu cầu</th>
              <th>Kỹ năng yêu cầu</th>
              <th>Trạng thái</th>
              <th>Cảnh báo AI</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="shiftTableBody"></tbody>
        </table>
      </div>

      <div id="emptyContainer" class="hidden"></div>
    </main>

    <div class="modal-overlay" id="shiftModal">
      <div class="modal" style="max-width: 600px">
        <div class="modal-header">
          <span id="shiftModalTitle">Tạo ca làm việc mới</span>
          <button class="modal-close" onclick="closeModal('shiftModal')">
            &times;
          </button>
        </div>
        <form id="shiftForm" onsubmit="handleShiftSubmit(event)">
          <div class="modal-body">
            <input type="hidden" id="shiftId" />

            <div class="form-group">
              <label class="form-label" for="shiftOppId"
                >Hoạt động trực thuộc *</label
              >
              <select class="form-select" id="shiftOppId" required></select>
              <div class="form-error"></div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="shiftDate">Ngày diễn ra *</label>
                <input type="date" class="form-input" id="shiftDate" required />
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label" for="shiftStartTime"
                  >Giờ bắt đầu *</label
                >
                <input
                  type="time"
                  class="form-input"
                  id="shiftStartTime"
                  required
                />
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label" for="shiftEndTime"
                  >Giờ kết thúc *</label
                >
                <input
                  type="time"
                  class="form-input"
                  id="shiftEndTime"
                  required
                />
                <div class="form-error"></div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="shiftRequired"
                  >Số lượng TNV cần *</label
                >
                <input
                  type="number"
                  class="form-input"
                  id="shiftRequired"
                  min="1"
                  value="5"
                  required
                />
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label" for="shiftCurrent"
                  >Đã có hiện tại</label
                >
                <input
                  type="number"
                  class="form-input"
                  id="shiftCurrent"
                  min="0"
                  value="0"
                />
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label" for="shiftStatus">Trạng thái *</label>
                <select class="form-select" id="shiftStatus" required>
                  <option value="open">Đang mở (open)</option>
                  <option value="filled">Đã đủ (filled)</option>
                  <option value="completed">Hoàn thành (completed)</option>
                  <option value="cancelled">Đã hủy (cancelled)</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Kỹ năng chuyên môn yêu cầu</label>
              <div class="checkbox-group" id="shiftSkillsCheckboxGroup"></div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('shiftModal')"
            >
              Hủy
            </button>
            <button type="submit" class="btn btn-primary">Lưu ca</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/services.js"></script>
    <script src="../../js/modules/ai-panel.js"></script>
    <script src="../../js/modules/shift-predictor.js"></script>
    <script src="../../js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
