<!doctype html>
<!-- Cấu trúc và nội dung giao diện cho trang đăng ký tài khoản. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản - VolunteerLink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="layout-public">
    <header class="public-header">
      <a
        class="logo"
        href="#"
        onclick="
          window.location.href = getPageUrl('index');
          return false;
        "
        >Volunteer<span>Link</span></a
      >
      <nav>
        <a
          href="#"
          onclick="
            window.location.href = getPageUrl('index');
            return false;
          "
          >Trang chủ</a
        >
        <a
          href="#"
          onclick="
            window.location.href = getPageUrl('login');
            return false;
          "
          >Đăng nhập</a
        >
      </nav>
    </header>

    <main class="public-content">
      <div class="auth-box" style="max-width: 480px">
        <h1>Tạo tài khoản mới</h1>
        <div class="auth-subtitle">
          Tham gia cộng đồng tình nguyện để cùng chung tay vì xã hội
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label" for="regName"
              >Họ và tên / Tên đơn vị *</label
            >
            <input
              type="text"
              class="form-input"
              id="regName"
              placeholder="Ví dụ: Nguyễn Văn An"
              required
            />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">Địa chỉ Email *</label>
            <input
              type="email"
              class="form-input"
              id="regEmail"
              placeholder="email@example.com"
              required
            />
            <div class="form-error"></div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="regPhone">Số điện thoại *</label>
              <input
                type="tel"
                class="form-input"
                id="regPhone"
                placeholder="09xxxxxxxx"
                required
              />
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="regRole"
                >Bạn tham gia với tư cách *</label
              >
              <select class="form-select" id="regRole" required>
                <option value="volunteer" selected>Tình nguyện viên</option>
                <option value="organization">Tổ chức xã hội</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="regPassword">Mật khẩu *</label>
              <input
                type="password"
                class="form-input"
                id="regPassword"
                placeholder="Tối thiểu 6 ký tự"
                minlength="6"
                required
              />
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="regConfirmPassword"
                >Xác nhận mật khẩu *</label
              >
              <input
                type="password"
                class="form-input"
                id="regConfirmPassword"
                placeholder="Nhập lại mật khẩu"
                required
              />
              <div class="form-error"></div>
            </div>
          </div>

          <div class="form-group">
            <label class="checkbox-label" style="border: none; padding: 0">
              <input type="checkbox" id="agreeTerms" required />
              <span style="font-size: 13px"
                >Tôi đồng ý với Quy chế hoạt động và Điều khoản của
                VolunteerLink</span
              >
            </label>
          </div>

          <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; padding: 10px; font-size: 15px"
          >
            Đăng ký tài khoản
          </button>
        </form>

        <div class="auth-footer">
          Đã có tài khoản?
          <a
            href="#"
            onclick="
              window.location.href = getPageUrl('login');
              return false;
            "
            style="font-weight: 600"
          >
            Đăng nhập tại đây
          </a>
        </div>
      </div>
    </main>

    <footer class="public-footer">
      © 2026 VolunteerLink - BTL Phát triển ứng dụng web
    </footer>

    <script src="../../js/services.js"></script>
    <script src="../../js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
