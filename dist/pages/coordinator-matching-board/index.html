<!doctype html>
<!-- VolunteerLink: Page structure and content for coordinator matching board. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghép tình nguyện viên - VolunteerLink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-content" id="main">
      <div class="page-header">
        <div>
          <h1>Ghép tình nguyện viên (Matching Board)</h1>
          <p
            style="
              color: var(--text-secondary);
              font-size: 14px;
              margin-top: 4px;
            "
          >
            Điều phối viên sử dụng thuật toán AI để tìm và ghép TNV phù hợp nhất
            vào các ca còn thiếu nhân sự
          </p>
        </div>
      </div>

      <div class="card mb-3" style="padding: 16px">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
          "
        >
          <label
            for="selectMatchingShift"
            style="font-weight: 600; font-size: 14px"
            >🎯 Chọn ca cần tìm nhân sự:</label
          >
          <select
            id="selectMatchingShift"
            class="form-select"
            style="max-width: 380px"
            onchange="handleSelectShiftChange()"
          ></select>
        </div>
        <div id="aiMatchingBoardPanel"></div>
      </div>

      <div class="board-layout">
        <div class="board-column">
          <div class="board-column-header flex-between">
            <span>📋 Ca đang cần bổ sung người</span>
            <span class="badge badge-warning" id="shortageShiftsBadge"
              >0 ca</span
            >
          </div>
          <div id="shiftsNeedPeopleList"></div>
        </div>

        <div class="board-column">
          <div class="board-column-header flex-between">
            <span>👥 Tình nguyện viên tích cực</span>
            <span class="badge badge-info" id="activeVolBadge">0 người</span>
          </div>
          <div id="availableVolunteersList"></div>
        </div>
      </div>
    </main>

    <script src="../../js/api.js"></script>
    <script src="../../js/modules/ai-panel.js"></script>
    <script src="../../js/modules/volunteer-matcher.js"></script>
    <script src="../../js/modules/shift-predictor.js"></script>
    <script src="../../js/main.js"></script>
    <script src="script.js"></script>
  </body>
</html>
