<!doctype html>
<!-- Cấu trúc và nội dung giao diện cho trang quản lý danh mục. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý danh mục kỹ năng - VolunteerLink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-content" id="main">
      <div class="page-header">
        <div>
          <h1>Quản lý danh mục kỹ năng</h1>
          <p
            style="
              color: var(--text-secondary);
              font-size: 14px;
              margin-top: 4px;
            "
          >
            Chuẩn hóa cây danh mục kỹ năng tình nguyện phục vụ ghép nối và phân
            bổ hoạt động
          </p>
        </div>
        <button class="btn btn-primary" onclick="openAddSkillModal()">
          ➕ Thêm kỹ năng mới
        </button>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="skillSearchInput"
            aria-label="Tìm kỹ năng theo tên hoặc mã"
            placeholder="Tìm kiếm theo tên kỹ năng hoặc mã..."
            oninput="filterSkills()"
          />
        </div>
        <select
          id="categoryFilter"
          class="filter-select"
          aria-label="Lọc kỹ năng theo nhóm danh mục"
          onchange="filterSkills()"
        >
          <option value="">-- Tất cả nhóm danh mục --</option>
          <option value="Y tế">Y tế</option>
          <option value="Giáo dục">Giáo dục</option>
          <option value="Hậu cần">Hậu cần</option>
          <option value="Vận chuyển">Vận chuyển</option>
          <option value="Truyền thông">Truyền thông</option>
          <option value="Ngôn ngữ">Ngôn ngữ</option>
          <option value="Tổ chức">Tổ chức</option>
        </select>
        <select
          id="statusFilter"
          class="filter-select"
          aria-label="Lọc kỹ năng theo trạng thái"
          onchange="filterSkills()"
        >
          <option value="">-- Tất cả trạng thái --</option>
          <option value="active">Hoạt động (active)</option>
          <option value="archived">Lưu trữ (archived)</option>
          <option value="inactive">Ngưng hoạt động (inactive)</option>
        </select>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã kỹ năng</th>
              <th>Tên kỹ năng</th>
              <th>Nhóm danh mục</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="skillTableBody"></tbody>
        </table>
      </div>

      <div id="emptyContainer" class="hidden"></div>
    </main>

    <div class="modal-overlay" id="skillModal">
      <div class="modal" style="max-width: 500px">
        <div class="modal-header">
          <span id="skillModalTitle">Thêm kỹ năng mới</span>
          <button class="modal-close" onclick="closeModal('skillModal')">
            &times;
          </button>
        </div>
        <form id="skillForm" onsubmit="handleSkillSubmit(event)">
          <div class="modal-body">
            <input type="hidden" id="skillId" />

            <div class="form-group">
              <label class="form-label" for="skillName">Tên kỹ năng *</label>
              <input
                type="text"
                class="form-input"
                id="skillName"
                placeholder="Ví dụ: Sơ cứu nâng cao, Lập trình Web..."
                required
              />
              <div class="form-error"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="skillCategory"
                >Nhóm danh mục *</label
              >
              <select class="form-select" id="skillCategory" required>
                <option value="Y tế">Y tế</option>
                <option value="Giáo dục">Giáo dục</option>
                <option value="Hậu cần">Hậu cần</option>
                <option value="Vận chuyển">Vận chuyển</option>
                <option value="Truyền thông">Truyền thông</option>
                <option value="Ngôn ngữ">Ngôn ngữ</option>
                <option value="Tổ chức">Tổ chức</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="skillStatus">Trạng thái *</label>
              <select class="form-select" id="skillStatus" required>
                <option value="active">Hoạt động (active)</option>
                <option value="archived">Lưu trữ (archived)</option>
                <option value="inactive">Ngưng hoạt động (inactive)</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('skillModal')"
            >
              Hủy
            </button>
            <button type="submit" class="btn btn-primary">Lưu kỹ năng</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/services.js"></script>
    <script src="../../js/modules/ai-panel.js"></script>
    <script src="../../js/modules/shift-predictor.js"></script>
    <script src="../../js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
